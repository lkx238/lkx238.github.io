services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Copy .env.example to .env and set N8N_ENCRYPTION_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_LOG_LEVEL: warn
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      GENERIC_TIMEZONE: ${TZ:-Asia/Taipei}
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - bot-internal

  line-gateway:
    build:
      context: ./gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/line-inbound
      DEDUPE_FILE: /data/processed-events.json
      MAX_BODY_BYTES: 1048576
      UPSTREAM_TIMEOUT_MS: 5000
    volumes:
      - gateway_data:/data
    depends_on:
      - n8n
    networks:
      - bot-internal

volumes:
  n8n_data:
  gateway_data:

networks:
  bot-internal:
    driver: bridge
